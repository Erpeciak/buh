<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
  #bg{position:fixed;inset:0;background:#111 center/cover no-repeat}
  #shade{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.4) 0,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 38%,rgba(0,0,0,.6) 62%,rgba(0,0,0,.92) 100%)}
  #ov{position:fixed;left:50%;top:50%;width:100vmin;height:100vmin;transform:translate(-50%,-50%);font-family:"Barlow Semi Condensed","Segoe UI",system-ui,sans-serif}
  #ov{filter:drop-shadow(0 0 1.2px rgba(0,0,0,.95)) drop-shadow(0 0 2px rgba(0,0,0,.9)) drop-shadow(0 0 5px rgba(0,0,0,.75))}
  .t{fill:#fff;font-weight:700}
  #meta{display:none}
  #idle{position:fixed;bottom:14vmin;width:100%;text-align:center;font-size:5vmin;opacity:.8;display:none}
  #setup{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;background:#111;padding:14vmin;text-align:center;font-size:3.6vmin}
  #setup input{width:100%;padding:1.5vmin;font-size:3.6vmin;border-radius:8px;border:0}
  #setup button{padding:1.5vmin 4vmin;font-size:3.6vmin;border-radius:99px;border:0;background:#1db954;color:#000;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div>

<svg id="ov" viewBox="0 0 100 100">
  <defs>
    <path id="pTop"/><path id="pTitle"/><path id="pArtist"/>
  </defs>
  <text id="time" class="t" font-size="8.5" letter-spacing=".9" text-anchor="middle"><textPath id="timeTp" href="#pTop" startOffset="50%"></textPath></text>
  <g id="meta">
    <text id="title" class="t" font-size="7.2" letter-spacing="1.2" text-anchor="middle"><textPath id="titleTp" href="#pTitle" startOffset="50%"></textPath></text>
    <text id="artist" class="t" x="50" y="73.5" font-size="8" font-weight="700" letter-spacing="1.6" text-anchor="middle"></text>
  </g>
</svg>

<div id="idle"></div>
<div id="setup">
  <div><b>Konfiguracja Spotify</b></div>
  <div>Wklej Client ID z Spotify Developer Dashboard<br>(Redirect URI: <code id="ru"></code>)</div>
  <input id="cid" placeholder="Client ID">
  <button id="login">Połącz ze Spotify</button>
</div>

<script>
const REDIRECT = location.origin + location.pathname;
const SCOPE = "user-read-currently-playing user-read-playback-state";
const $ = id => document.getElementById(id);
const IDLE_IMG = "idle.gif"; // obraz/gif pokazywany, gdy nic nie gra (plik obok index.html albo pełny adres https://...)

// ---- łuki, po których biegnie tekst ----
function arcTop(r, deg){ const a=deg*Math.PI/180, x=r*Math.cos(a), y=r*Math.sin(a); return `M ${50-x} ${50-y} A ${r} ${r} 0 0 1 ${50+x} ${50-y}`; }
function arcBottom(r, deg){ const a=deg*Math.PI/180, x=r*Math.cos(a), y=r*Math.sin(a); return `M ${50-x} ${50+y} A ${r} ${r} 0 0 0 ${50+x} ${50+y}`; }
$("pTop").setAttribute("d", arcTop(36, 30));
$("pTitle").setAttribute("d", arcBottom(42.5, 22));
$("pArtist").setAttribute("d", arcBottom(42, 26));

// dopasowanie tekstu do długości łuku (zmniejsza czcionkę, a w ostateczności skraca z "…")
function fitArc(textId, tpId, pathId, text, size, min){
  const el = $(textId), tp = $(tpId), path = $(pathId);
  const maxLen = path.getTotalLength() * 0.94;
  let s = size; el.setAttribute("font-size", s);
  tp.textContent = text;
  while (el.getComputedTextLength() > maxLen && s > min) { s -= 0.2; el.setAttribute("font-size", s); }
  let t = text;
  while (el.getComputedTextLength() > maxLen && t.length > 1) { t = t.slice(0,-1); tp.textContent = t.trimEnd() + "…"; }
}

// prosta (niewygięta) linia tekstu, zmniejszana lub skracana do zadanej szerokości
function fitLine(textId, text, size, min, maxW){
  const el = $(textId); let t = text.toUpperCase();
  el.textContent = t; let s = size; el.setAttribute("font-size", s);
  while (el.getComputedTextLength() > maxW && s > min) { s -= 0.2; el.setAttribute("font-size", s); }
  while (el.getComputedTextLength() > maxW && t.length > 1) { t = t.slice(0,-1); el.textContent = t.trimEnd() + "…"; }
}

// ---- czas utworu ----
let prog = null;
const fmt = ms => { const s=Math.floor(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
function tick(){
  if(!prog){ $("timeTp").textContent=""; return; }
  let ms = prog.ms + (prog.playing ? Date.now()-prog.at : 0);
  ms = Math.min(ms, prog.dur);
  if (prog.playing && ms >= prog.dur && !prog.asked) { prog.asked = true; setTimeout(poll, 300); }
  $("timeTp").textContent = fmt(ms)+" / "+fmt(prog.dur);
}
setInterval(tick,250);

// ---- logowanie PKCE ----
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function rand(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return b64url(a).slice(0,n); }

async function startLogin(clientId){
  const verifier = rand(64);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  sessionStorage.setItem("v", verifier); sessionStorage.setItem("c", clientId);
  const p = new URLSearchParams({client_id:clientId,response_type:"code",redirect_uri:REDIRECT,scope:SCOPE,code_challenge_method:"S256",code_challenge:challenge});
  location.href = "https://accounts.spotify.com/authorize?" + p;
}

async function tokenRequest(body){
  const r = await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(body)});
  return r.json();
}

const hash = new URLSearchParams(location.hash.slice(1));
const query = new URLSearchParams(location.search);
let clientId = hash.get("c"), refresh = hash.get("r"), access = null, expires = 0;

async function boot(){
  if (query.get("code")) {
    const j = await tokenRequest({grant_type:"authorization_code",code:query.get("code"),redirect_uri:REDIRECT,client_id:sessionStorage.getItem("c"),code_verifier:sessionStorage.getItem("v")});
    if (j.refresh_token) { location.replace(REDIRECT + "#c=" + encodeURIComponent(sessionStorage.getItem("c")) + "&r=" + encodeURIComponent(j.refresh_token)); return; }
    document.body.textContent = "Błąd logowania: " + JSON.stringify(j); return;
  }
  if (!clientId || !refresh) {
    $("ru").textContent = REDIRECT; $("setup").style.display = "flex";
    $("login").onclick = () => { const v=$("cid").value.trim(); if(v) startLogin(v); };
    return;
  }
  poll(); setInterval(poll, 1000);
}

async function getAccess(){
  if (access && Date.now() < expires - 30000) return access;
  const j = await tokenRequest({grant_type:"refresh_token",refresh_token:refresh,client_id:clientId});
  if (j.access_token) { access=j.access_token; expires=Date.now()+j.expires_in*1000; if (j.refresh_token) refresh=j.refresh_token; }
  else { access=null; lastErr="token: "+(j.error_description||j.error||"?"); }
  return access;
}

let lastId = null, lastErr = "";
function showErr(m){ prog=null; $("meta").style.display="none"; $("idle").style.display="block"; $("idle").textContent=m; }

let busy = false;
async function poll(){
  if (busy) return; busy = true;
  try {
    const t = await getAccess(); if (!t) return showErr(lastErr);
    const r = await fetch("https://api.spotify.com/v1/me/player/currently-playing?additional_types=episode",{headers:{Authorization:"Bearer "+t}});
    if (r.status === 204 || r.status === 202) return show(null);
    if (!r.ok) return showErr("API "+r.status);
    const j = await r.json();
    prog = (j && j.item && j.is_playing) ? {ms:j.progress_ms||0, dur:j.item.duration_ms||0, playing:j.is_playing, at:Date.now()} : null;
    show(j && j.item && j.is_playing ? j.item : null);
  } catch(e) { showErr("fetch: "+e.message); } finally { busy = false; }
}

function show(item){
  if (!item) { lastId=null; prog=null; $("bg").style.backgroundImage=`url(${IDLE_IMG})`; $("meta").style.display="none"; $("idle").style.display="none"; return; }
  $("idle").style.display="none"; $("meta").style.display="inline";
  if (item.id === lastId) return;
  lastId = item.id;
  const imgs = (item.album && item.album.images) || item.images || [];
  $("bg").style.backgroundImage = imgs[0] ? `url(${imgs[0].url})` : "none";
  const artist = item.artists ? item.artists.map(a=>a.name).join(", ") : (item.show ? item.show.name : "");
  curName = item.name; curArtist = artist; layoutText();
}

let curName = "", curArtist = "";
function layoutText(){
  if (!curName) return;
  fitArc("title","titleTp","pTitle", curName, 10.5, 5);
  fitLine("artist", curArtist, 8, 4.2, 54);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutText); // przelicz po załadowaniu czcionki

boot();
</script>
</body>
</html>
